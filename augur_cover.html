<title>Augur Fraud Detection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #05070a;
    --ink: #0d1117;
    --line: #1e2733;
    --paper: #e9edf2;
    --muted: #7d8b9a;
    --faint: #4a5563;
    --gold: #f2c14e;
    --gold-dim: #8a6d2e;
    --illicit: #e5534b;
    --licit: #3f8fd6;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--void);
    color: var(--paper);
  }

  body {
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    overflow: auto;
  }

  main {
    display: block;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    position: relative;
  }

  .stage {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 1.4vh, 16px);
    background:
      radial-gradient(circle at 50% 34%, rgba(242,193,78,0.06), transparent 58%),
      radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
      linear-gradient(180deg, var(--ink), #05070a 92%);
    background-size: auto, 28px 28px, auto;
    background-position: 0 0, -3px -3px, 0 0;
    padding: 2vh 6vw;
    overflow: hidden;
  }

  .eyebrow {
    display: flex;
    justify-content: center;
    gap: 10px;
    align-items: center;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11.5px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--faint);
    margin: 0 0 40px;
    opacity: 0;
    animation: rise 0.6s ease-out 1.05s forwards;
  }
  .eyebrow .pip {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px 1px rgba(242,193,78,0.6);
  }

  figure.mark {
    margin: 0;
    width: clamp(90px, 11vw, 170px);
  }
  figure.mark svg { display: block; width: 100%; height: auto; }

  .ring-edge {
    fill: none;
    stroke: var(--line);
    stroke-width: 1.4;
    stroke-dasharray: 400;
    stroke-dashoffset: 400;
    animation: draw 1.1s ease-out 0.15s forwards;
  }
  .spoke {
    stroke: var(--gold-dim);
    stroke-width: 1.2;
    stroke-dasharray: 130;
    stroke-dashoffset: 130;
    animation: draw 0.7s ease-out forwards;
  }
  .node {
    opacity: 0;
    transform-origin: center;
    animation: pop 0.5s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  .node.center {
    animation-delay: 0.05s;
  }

  h1.word {
    font-family: "Cinzel", serif;
    font-weight: 600;
    font-size: clamp(48px, 8vw, 128px);
    text-align: center;
    letter-spacing: 0.14em;
    margin: 0;
    padding-left: 0.14em;
    color: var(--paper);
    text-shadow: 0 0 34px rgba(242,193,78,0.16);
    opacity: 0;
    animation: rise 0.7s ease-out 0.85s forwards;
  }

  p.kicker {
    text-align: center;
    font-family: "IBM Plex Mono", monospace;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 22px;
    padding-left: 0.34em;
    opacity: 0;
    animation: rise 0.7s ease-out 0.98s forwards;
  }

  p.tagline {
    text-align: center;
    max-width: 46ch;
    margin: 0 auto;
    font-style: italic;
    font-size: 15.5px;
    line-height: 1.6;
    color: var(--muted);
    opacity: 0;
    animation: rise 0.7s ease-out 1.15s forwards;
  }

  .ledger {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0;
    border-top: 1px solid var(--line);
    margin-top: 8px;
    opacity: 0;
    animation: rise 0.6s ease-out 1.3s forwards;
  }
  .stat {
    font-family: "IBM Plex Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    color: var(--muted);
    padding: 18px 22px;
    border-right: 1px solid var(--line);
    white-space: nowrap;
  }
  .stat:last-child { border-right: none; }
  .stat b { color: var(--paper); font-weight: 600; }
  .stat .dot { color: var(--gold); }

  .try-live {
    display: inline-block;
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--void);
    background: var(--gold);
    padding: 9px 20px;
    border-radius: 6px;
    opacity: 0;
    animation: rise 0.6s ease-out 1.38s forwards;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .try-live:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 18px rgba(242,193,78,0.28);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes draw {
    to { stroke-dashoffset: 0; }
  }
  @keyframes pop {
    to { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .eyebrow, h1.word, p.kicker, p.tagline, .ledger, .try-live, .node {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
    .ring-edge, .spoke {
      animation: none !important;
      stroke-dashoffset: 0 !important;
    }
  }

  @media (max-width: 560px) {
    .stage { padding: 44px 20px 0; }
    h1.word { font-size: 40px; letter-spacing: 0.08em; }
    .stat { padding: 14px 14px; font-size: 11px; }
  }
</style>

<main>
  <div class="stage">
    <figure class="mark">
      <svg viewBox="0 0 300 300" role="img" aria-label="Augur logomark: a ring of transaction nodes around a central seed node, with gold lines reaching out to the nodes flagged illicit or licit, like a stylised eye reading the graph.">
        <polygon class="ring-edge" points="260,150 245,205 205,245 150,260 95,245 55,205 40,150 55,95 95,55 150,40 205,55 245,95" />

        <line class="spoke" x1="150" y1="150" x2="260" y2="150" style="animation-delay:0.65s" />
        <line class="spoke" x1="150" y1="150" x2="150" y2="260" style="animation-delay:0.72s" />
        <line class="spoke" x1="150" y1="150" x2="55" y2="205" style="animation-delay:0.79s" />
        <line class="spoke" x1="150" y1="150" x2="55" y2="95" style="animation-delay:0.86s" />
        <line class="spoke" x1="150" y1="150" x2="150" y2="40" style="animation-delay:0.93s" />
        <line class="spoke" x1="150" y1="150" x2="205" y2="55" style="animation-delay:1.0s" />

        <circle class="node" cx="245" cy="205" r="6" fill="var(--faint)" style="animation-delay:0.55s" />
        <circle class="node" cx="205" cy="245" r="6" fill="var(--faint)" style="animation-delay:0.58s" />
        <circle class="node" cx="95"  cy="245" r="6" fill="var(--faint)" style="animation-delay:0.61s" />
        <circle class="node" cx="40"  cy="150" r="6" fill="var(--faint)" style="animation-delay:0.64s" />
        <circle class="node" cx="95"  cy="55"  r="6" fill="var(--faint)" style="animation-delay:0.67s" />
        <circle class="node" cx="245" cy="95"  r="6" fill="var(--faint)" style="animation-delay:0.70s" />

        <circle class="node" cx="260" cy="150" r="7.5" fill="var(--illicit)" style="animation-delay:0.73s" />
        <circle class="node" cx="55"  cy="205" r="7.5" fill="var(--illicit)" style="animation-delay:0.79s" />
        <circle class="node" cx="150" cy="40"  r="7.5" fill="var(--illicit)" style="animation-delay:0.85s" />

        <circle class="node" cx="150" cy="260" r="7.5" fill="var(--licit)" style="animation-delay:0.76s" />
        <circle class="node" cx="55"  cy="95"  r="7.5" fill="var(--licit)" style="animation-delay:0.82s" />
        <circle class="node" cx="205" cy="55"  r="7.5" fill="var(--licit)" style="animation-delay:0.88s" />

        <circle class="node center" cx="150" cy="150" r="15" fill="var(--gold)" stroke="#05070a" stroke-width="3" style="animation-delay:0.35s" />
      </svg>
    </figure>

    <p class="eyebrow"><span class="pip"></span>Elliptic bitcoin transaction graph<span class="pip"></span></p>

    <h1 class="word">AUGUR</h1>
    <p class="kicker">Fraud Detection System</p>
    <p class="tagline">Reading two hops into the ledger for the pattern no single transaction gives away.</p>

    <div class="ledger">
      <div class="stat"><b>203,769</b> nodes</div>
      <div class="stat"><b>234,355</b> tdt edges</div>
      <div class="stat">GraphSAGE F1 <b>0.6434</b></div>
      <div class="stat">CARE-GNN AUC <b>0.853</b></div>
      <div class="stat"><b>7</b> ablation variants</div>
      <div class="stat"><b>2-hop</b> expansion</div>
    </div>

    <a class="try-live" href="http://localhost:8000/app">Try it live &rarr;</a>
  </div>
</main>
