version: "3.8"

services:
  mlflow:
    image: python:3.11-slim
    working_dir: /mlflow
    command: >
      bash -c "pip install mlflow>=2.8.0 &&
               mlflow server --host 0.0.0.0 --port 5000
               --backend-store-uri /mlflow/mlruns
               --default-artifact-root /mlflow/mlruns"
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow/mlruns
